<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d18"/><stop offset="1" stop-color="#15102b"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63e6be"/><stop offset=".5" stop-color="#7c83ff"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="380" rx="28" fill="url(#bg)"/>
<circle cx="930" cy="100" r="95" fill="#625bff" opacity=".18" filter="url(#blur)"/>
<circle cx="1080" cy="260" r="90" fill="#e879f9" opacity=".15" filter="url(#blur)"/>
<g fill="none" stroke="#6d77ff" opacity=".2">
  <path d="M700 0V380M800 0V380M900 0V380M1000 0V380M1100 0V380"/>
  <path d="M650 60H1200M650 120H1200M650 180H1200M650 240H1200M650 300H1200"/>
</g>
<text x="72" y="83" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">ENGINEERING  /  AI  /  PRODUCT</text>
